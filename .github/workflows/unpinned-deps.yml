name: Unpinned dependencies build

# Daily build with unpinned (latest) dependencies to catch upstream
# compatibility issues before they reach a release.

on:
  schedule:
    # Run daily at 06:17 UTC (off-peak minute to avoid contention)
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: unpinned-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: Generate a sample project
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.x"
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Install dependencies
      run: uv sync --no-dev --group test
    - name: Generate a sample project
      run: uv run --no-sync -m test.test_projects test.test_0_basic.basic_project sample_proj
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sample_proj
        path: sample_proj

  test:
    name: Unpinned deps on ${{ matrix.os }} (${{ matrix.python_version }}) ${{ matrix.test_select }}
    needs: sample
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python_version: '3.11'
        - os: ubuntu-latest
          python_version: '3.13'
        - os: ubuntu-latest
          python_version: '3.14'
        - os: ubuntu-24.04-arm
          python_version: '3.13'
        - os: windows-latest
          python_version: '3.13'
        - os: macos-15-intel
          python_version: '3.13'
        - os: macos-15
          python_version: '3.13'
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      name: Install Python ${{ matrix.python_version }}
      with:
        python-version: ${{ matrix.python_version }}
        allow-prereleases: true

    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Free up disk space
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf $ANDROID_HOME/ndk /opt/hostedtoolcache/CodeQL \
          /usr/local/lib/node_modules /usr/local/share/chromium \
          /usr/local/share/powershell
        df -m

    # for oci_container unit tests
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

    - name: Set up Xcode
      if: ${{ startsWith(matrix.os, 'macos-15') }}
      run: |
        sudo xcode-select --switch /Applications/Xcode_16.4.app

    - name: Install dependencies
      run: uv sync --no-dev --group test

    - name: Set CIBW_ENABLE
      shell: bash
      run: |
        CIBW_ENABLE=$(uv run --no-sync python -c 'import sys, test.utils as c; sys.stdout.write(c.DEFAULT_CIBW_ENABLE)')
        echo "CIBW_ENABLE=${CIBW_ENABLE}" >> $GITHUB_ENV

    - name: Download a sample project
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sample_proj
        path: sample_proj

    - name: Run a sample build (GitHub Action)
      uses: ./
      with:
        package-dir: sample_proj
        output-dir: wheelhouse
      env:
        CIBW_DEPENDENCY_VERSIONS: latest
        CIBW_ARCHS_MACOS: x86_64 universal2 arm64
        CIBW_BUILD_FRONTEND: 'build[uv]'

    - name: Check Action artifacts
      shell: bash
      run: |
        test $(find wheelhouse -name '*.whl' | wc -l) -ge 1

    - name: Test cibuildwheel
      run: uv run --no-sync bin/run_tests.py --test-select=native ${{ (runner.os == 'Linux' && runner.arch == 'X64') && '--run-podman' || '' }}
      env:
        CIBW_DEPENDENCY_VERSIONS: latest

  test-pyodide:
    name: Unpinned deps - Pyodide
    needs: sample
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install dependencies
      run: uv sync --no-dev --group test

    - name: Download a sample project
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sample_proj
        path: sample_proj

    - name: Run a sample build (GitHub Action)
      uses: ./
      with:
        package-dir: sample_proj
        output-dir: wheelhouse
      env:
        CIBW_DEPENDENCY_VERSIONS: latest
        CIBW_PLATFORM: pyodide
        CIBW_ENABLE: pyodide-prerelease

    - name: Run tests with 'CIBW_PLATFORM' set to 'pyodide'
      run: uv run --no-sync ./bin/run_tests.py
      env:
        CIBW_DEPENDENCY_VERSIONS: latest
        CIBW_PLATFORM: pyodide
        CIBW_ENABLE: pyodide-prerelease

  report-failure:
    name: Report failure
    needs: [test, test-pyodide]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Collect failed jobs
      id: failures
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the current workflow run URL
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # Build the issue body with failure details
        cat > /tmp/issue_body.md <<EOF
        ## Unpinned dependencies build failed

        The daily build with \`CIBW_DEPENDENCY_VERSIONS=latest\` has failed.
        This indicates an upstream dependency has released a new version that
        is incompatible with cibuildwheel.

        **Workflow run:** ${RUN_URL}
        **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')
        **Commit:** \`${{ github.sha }}\`

        ### Failed jobs

        EOF

        # Query the run to find failed jobs
        gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
          --jq '.jobs[] | select(.conclusion == "failure") | "- **\(.name)** ([logs](\(.html_url)))"' \
          >> /tmp/issue_body.md

        cat >> /tmp/issue_body.md <<EOF

        ### Action required

        Please investigate the failing job logs to identify which upstream
        package caused the breakage, and either:
        1. Update the constraints files to pin a compatible version
        2. Fix the incompatibility in cibuildwheel
        3. Report the issue upstream if it's a bug in the dependency

        ---
        *This issue was automatically created by the unpinned dependencies workflow.*
        EOF

        echo "body_file=/tmp/issue_body.md" >> "$GITHUB_OUTPUT"

    - name: Ensure label exists
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh label create "unpinned-deps-failure" \
          --color "D93F0B" \
          --description "Auto-created when daily unpinned dependencies build fails" \
          --force 2>/dev/null || true

    - name: Check for existing open issue
      id: existing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        EXISTING=$(gh issue list \
          --label "unpinned-deps-failure" \
          --state open \
          --json number \
          --jq '.[0].number // empty')
        echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"

    - name: Create or update issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ -n "${{ steps.existing.outputs.number }}" ]]; then
          # Add a comment to the existing issue
          gh issue comment "${{ steps.existing.outputs.number }}" \
            --body "Another unpinned dependencies build failed on $(date -u '+%Y-%m-%d %H:%M UTC'). See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
        else
          # Create a new issue
          gh issue create \
            --title "Daily unpinned dependencies build failed ($(date -u '+%Y-%m-%d'))" \
            --label "unpinned-deps-failure" \
            --body-file "${{ steps.failures.outputs.body_file }}"
        fi
